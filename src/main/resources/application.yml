camunda.bpm:
  admin-user:
    id: tom
    password: tom
    firstName: tom
  filter:
    create: All tasks
  # Disable the writing of the history data from processes that have completed
  history-level: none
  # Camunda 7.20+ enforces a non-null historyTimeToLive at deploy time
  # (ENGINE-12018). Provide a default so the BPMN models deploy without each
  # model declaring camunda:historyTimeToLive. Harmless with history-level: none
  # (history cleanup never runs).
  generic-properties:
    properties:
      historyTimeToLive: P30D
  database:
    schema-update: create-drop # true
    type: postgres

# Spring boot Datasource configuration to the main process engine
spring.datasource:
  url: "jdbc:postgresql://${DATASOURCE_DB:localhost}:${DATASOURCE_PORT:5432}/${DATASOURCE_SCHEMA:camunda}"
  # url: ${DATASOURCE_URL:'jdbc:postgresql://localhost:5432/camunda'}
  username: ${DATASOURCE_USERNAME:camunda}
  password: ${DATASOURCE_PASSWORD:camunda}
  driverClassName: org.postgresql.Driver

server:
  port: 8080

constant:
  batchSize: 1000
  jobsPerSeed: 10
  invocationsPerBatchJob: 200
